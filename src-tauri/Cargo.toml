[package]
name = "designer-apparels-invoice"
version = "1.0.0"
description = "Local GST invoicing app for Designer Apparels"
authors = ["Designer Apparels"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled sqlite so users don't need sqlite installed on their machine
rusqlite = { version = "0.31", features = ["bundled"] }
# Pure-Rust PDF generation, no external binary/browser dependency
printpdf = "0.5.3"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
anyhow = "1"
# Phase 0 foundations: licensing (HMAC + hardware ID) and login password hashing
hmac = "0.12"
sha2 = "0.10"
mac_address = "1.1"
bcrypt = "0.15"

[features]
custom-protocol = ["tauri/custom-protocol"]
